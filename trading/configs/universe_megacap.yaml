  - {symbol: TSM,   currency: USD, exchange: XNYS, name: TSMC ADR,             half_spread_bps: 3.0}
  - {symbol: CRM,   currency: USD, exchange: XNYS, name: Salesforce,           half_spread_bps: 3.0}
