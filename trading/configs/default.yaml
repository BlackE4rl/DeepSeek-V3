# Default configuration for the SMA20-pullback trend-following strategy.
#
# Every value here is a parameter of the simulation. Nothing in the code carries
# a hidden default that is not represented in this file, so the SHA-256 hash of
# the resolved configuration (printed in every report) fully identifies a run.

strategy:
  # --- Long-term trend filter -------------------------------------------------
  sma_long: 200                 # price must trade above this average
  sma_slope_lookback: 20        # ... and the average must exceed its own value 20 bars ago
  sma_mid: 50                   # stacking filter: SMA50 > SMA200

  # --- Pullback reference -----------------------------------------------------
  sma_pullback: 20              # the moving average price must pull back to
  pullback_touch_window: 5      # a touch must have occurred within this many bars
  pullback_max_depth_atr: 1.5   # ... and not more than this many ATRs below it

  # --- Volatility / stops -----------------------------------------------------
  atr_period: 14                # Wilder ATR
  atr_stop_mult: 2.5            # initial stop distance in ATRs
  atr_trail_mult: 3.5           # Chandelier trailing distance in ATRs

  # --- Market regime ----------------------------------------------------------
  regime_symbol: QQQ
  regime_sma: 200
  exit_on_regime_off: false     # regime gates entries only; open positions keep their stops

  # --- Tradability filters ----------------------------------------------------
  min_price_local: 5.0          # junk filter, in the symbol's local currency
  min_adv_acct: 20000000.0      # 20-day average traded value, in account currency
  cooldown_bars: 5              # bars after an exit before the symbol may be re-entered
  time_stop_bars: 0             # 0 disables the time stop

portfolio:
  initial_equity: 100000.0
  account_currency: EUR
  risk_per_trade: 0.0075        # 0.75 % of equity risked between entry and initial stop
  max_positions: 6
  max_position_weight: 0.25     # notional cap per position
  max_portfolio_heat: 0.06      # summed open risk across all positions
  max_adv_participation: 0.05   # never buy more than 5 % of 20-day average volume
  allow_fractional_shares: false
  max_order_age_days: 5         # cancel orders that could not be filled (halt, delisting)

costs:
  # Approximates the DEGIRO tariff for Xetra: 2.00 EUR plus 0.026 % of the
  # order value, charged on both sides of every trade. The US tariff has a
  # per-share component (0.50 EUR + 0.004 USD per share) that this model cannot
  # express; at a typical position size of a few thousand euro the two land in
  # the same range, and the sensitivity run stresses costs up to 4x anyway.
  #
  # These figures come from broker comparison sites (checked 2026-08), not from
  # the Preisverzeichnis. Verify them against your own before trusting a result:
  # tariffs change, and the report prints whatever is set here.
  commission_fixed_acct: 2.0
  commission_bps: 2.6
  min_commission_acct: 2.0
  slippage_bps: 5.0             # market-on-open slippage
  half_spread_bps: 3.0          # default; per-symbol overrides live in the universe file
  stop_extra_slippage_bps: 10.0 # stops fill worse than resting market orders

data:
  price_mode: adjusted          # "adjusted" (default) or "raw"

backtest:
  start: null                   # null = earliest date available in the data
  end: null
  benchmark_symbol: QQQ
  risk_free_rate: 0.0
  debug_assertions: true        # per-bar cash and equity invariants

tax:
  # German capital income tax for a private investor.
  #
  # The strategy holds shares directly, so every realized gain is taxed in full
  # in the year it is realized. An ETF is an equity fund: 30 % of its return is
  # exempt and the tax on the price gain waits until the units are sold. That
  # asymmetry, not the commission, is the biggest hurdle an active strategy has
  # to clear -- which is why it is modelled rather than waved away.
  capital_gains_rate: 0.25      # Abgeltungsteuer
  solidarity_surcharge: 0.055   # Solidaritaetszuschlag -> 26.375 % combined
  church_tax: 0.0               # 0.08 or 0.09 where it applies
  annual_allowance: 1000.0      # Sparerpauschbetrag, single filer
  fund_partial_exemption: 0.30  # Teilfreistellung, fund units only

  # "assessment": a foreign broker such as DEGIRO withholds nothing; the gains
  #   go into the annual return and the bill arrives months later, so they keep
  #   compounding in the meantime.
  # "withholding": a German broker deducts at every realizing trade.
  settlement: assessment
  payment_lag_months: 12        # after the end of the tax year

  # Basiszins per section 18 (4) InvStG, published by the BMF each January and
  # used for the Vorabpauschale. 2021 and 2022 were negative, so no
  # Vorabpauschale was levied at all; they are recorded as zero. Years outside
  # this table levy nothing -- extend it rather than relying on that.
  basiszins:
    2018: 0.0087
    2019: 0.0052
    2020: 0.0007
    2021: 0.0
    2022: 0.0
    2023: 0.0255
    2024: 0.0229
    2025: 0.0253
    2026: 0.0320
  enabled: true
